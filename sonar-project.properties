# Settings of the SonarQube analysis, read by .github/workflows/sonarqube.yml.
# The organization and the project key are given by the workflow.

# The code of the server and of the client.
sonar.sources=server/src,client/src

# The tests are not analysed as code: they are marked as tests.
sonar.tests=server/test,client/test,e2e/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# The mock server is a fake backend that the client uses only in development.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,client/src/api/mockServer.js

# Only the server tests produce coverage (server/coverage/lcov.info, made by the workflow), so the
# client and the end-to-end tests are left out of the coverage instead of counting as not covered.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
# index.js only starts the server: no test loads it.
sonar.coverage.exclusions=client/**,e2e/**,server/src/index.js
