# Settings of the SonarQube analysis, read by .github/workflows/sonarqube.yml.
# The organization and the project key are given by the workflow.

# SonarQube Cloud analyses the whole project: what is not the code of the product is left out here.
# The tests, the documents and the mockups, the workflows and the Docker files, the SQL of the migrations, the
# tools of the database, the mock server of the client and the configuration files are not analysed.
sonar.exclusions=\
  **/node_modules/**,**/dist/**,**/coverage/**,\
  server/test/**,client/test/**,e2e/**,\
  docs/**,retrospective_docs/**,\
  .github/**,Dockerfile,docker-compose.yml,\
  server/migrations/**,server/scripts/**,\
  client/src/api/mockServer.js,\
  **/eslint.config.js,**/vite.config.js,**/vitest.config.js,**/vitest.unit.config.js

# Only the server tests produce coverage (server/coverage/lcov.info, made by the workflow), so the
# client is left out of the coverage instead of counting as not covered.
# index.js only starts the server: no test loads it.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
sonar.coverage.exclusions=client/**,server/src/index.js
