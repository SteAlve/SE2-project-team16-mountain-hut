# Continuous Integration
#
# Runs on every Pull Request into dev, qa and main, so a change is checked before it merges.
# integration.yml, qa.yml and deploy.yml call it after a push, to check the merged result again.
#
# The names of the jobs are the names of the checks that the rulesets are to require: today the
# rulesets require only the checks of branch-flow.yml (see docs/ci-cd-test-report.md).
#   Server: lint and tests   always
#   Client: lint and build   always
#   E2E tests                Pull Requests into qa and main, and when the caller asks for it
#
# None of them runs when the change is only in Markdown files (*.md): there is no code to check.
# The job "Which files changed" looks at the files, and the others are skipped, not left out of the
# workflow: GitHub counts a skipped job as passed, so a check that a ruleset requires does not stay
# waiting. A paths-ignore on the trigger would leave it waiting, and the PR could not merge.
# When the rulesets start to require these checks, confirm it with a Pull Request of only .md files.

name: CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - main
  workflow_call:
    inputs:
      e2e:
        description: Also run the end-to-end tests
        type: boolean
        default: false

# The jobs only read the repository.
permissions:
  contents: read

# A new push to a Pull Request cancels the run that is still going for the same Pull Request.
# After a push there is no Pull Request, so the group is unique and nothing is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Is there something to check? Not when every changed file is a Markdown file.
  # On a Pull Request the files are the ones of the PR; after a push (integration, qa and deploy call
  # this workflow) they are the ones between the old and the new head of the branch. When the files
  # cannot be worked out (a new branch, a forced push), everything runs.
  changes:
    name: Which files changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only Markdown files changed?
        id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || files=""
          else
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER") || files=""
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only Markdown files changed: the server, client and E2E checks are skipped."
          fi

  server:
    name: "Server: lint and tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mountain_hut_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mountain_hut_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mountain_hut_test
    # Do not rename this job: its name is the check that the branch rulesets are to require.
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Use the Node.js version pinned in .nvmrc.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test

  client:
    name: "Client: lint and build"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run client unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E tests
    needs: changes
    # Inputs are empty for pull_request events; only the target branch applies there.
    if: needs.changes.outputs.code == 'true' && (inputs.e2e || github.base_ref == 'qa' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mountain_hut_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Receives the emails of the server; the MH-3 tests read them through its API.
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mountain_hut_e2e
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      # The tests start the server and client themselves, so install all three packages.
      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix e2e

      - name: Apply database migrations
        run: DATABASE_URL="$E2E_DATABASE_URL" npm run db:migrate --prefix server

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        working-directory: e2e
        run: npm run e2e

      # Keep the Playwright report when a test fails.
      - name: Upload the E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
