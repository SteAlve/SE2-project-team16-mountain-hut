# This workflow enforces the project's branch flow:
#
#   fix/*, test/* ──> qa
#   dev ────────────> qa ──> main
#
# It performs three checks:
#
# 1. Validates that Pull Requests follow the allowed branch flow.
# 2. Ensures that a new dev -> qa batch can enter qa only after the previous batch has been promoted to main.
# 3. Ensures that fixes made during QA are back-merged into dev before the next batch is promoted.
#
# This prevents untested code from reaching main, avoids mixing batches in qa, and prevents QA fixes from being lost.

name: Branch Flow

on:
  pull_request:
    branches:
      - main
      - qa
      - dev

jobs:
  validate-branch-flow:
    name: Validate branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Pull Request: $HEAD_BRANCH -> $BASE_BRANCH"

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "qa" ]]; then
            echo "ERROR: Only 'qa' can be merged into 'main'."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "qa" ]]; then
            case "$HEAD_BRANCH" in
              dev | fix/* | test/*) ;;
              *)
                echo "ERROR: Only 'dev' (a new batch) or 'fix/*' and 'test/*' branches"
                echo "(changes to the batch already in qa) can be merged into 'qa'."
                exit 1
                ;;
            esac
          fi

          echo "Branch flow is valid."

  # qa tests one batch at a time: a new dev -> qa PR waits until the batch already in qa
  # has been promoted to main. Otherwise untested work from dev would mix with it.
  # fix/* and test/* PRs are not held back: they stabilize that batch, so they must be able
  # to reach qa while it is still there.
  qa-promotion-gate:
    name: Qa is promoted to main
    if: github.base_ref == 'qa' && github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that qa has no commits missing from main
        run: |
          pending=$(git rev-list --count origin/main..origin/qa)

          if [ "$pending" -ne 0 ]; then
            echo "ERROR: qa has $pending commit(s) that are not in main yet."
            echo "Test qa and promote it to main before opening a new dev -> qa PR."
            git log --oneline --no-merges origin/main..origin/qa
            exit 1
          fi

          echo "qa is fully promoted to main."

  # Fixes made on qa (fix/* and test/* branches) must be back-merged into dev before the next
  # batch moves. Otherwise dev -> qa could undo them or conflict with them. Merge commits are
  # ignored: every dev -> qa PR creates one on qa, and dev never needs it.
  dev-has-qa-fixes:
    name: Dev has everything from qa
    if: github.base_ref == 'qa' && github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that dev contains every commit made on qa
        run: |
          missing=$(git rev-list --count --no-merges origin/dev..origin/qa)

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: qa has $missing commit(s) that dev does not have yet (fixes made on qa)."
            echo "Back-merge qa into dev first: open a PR from qa into dev and merge it"
            echo "with 'Create a merge commit' (not squash, not rebase)."
            git log --oneline --no-merges origin/dev..origin/qa
            exit 1
          fi

          echo "dev contains everything that was made on qa."

  # A branch that goes into dev must contain the current dev. If dev moved after the branch
  # was cut, the work was never tried together with what others have merged since.
  # The back-merges from qa and main are older than dev by design, so they are not checked.
  # This check is required by the ruleset of dev, which cannot tell where a PR comes from, and
  # a skipped required check is not reliably counted as passed. So the job always runs, and for
  # a back-merge it just reports success without doing anything.
  up-to-date-with-dev:
    name: Branch is up to date with dev
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Back-merges are not checked
        if: github.head_ref == 'qa' || github.head_ref == 'main'
        run: echo "A back-merge is older than dev by design, so there is nothing to check."

      - name: Checkout the branch with full history
        if: github.head_ref != 'qa' && github.head_ref != 'main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check that the branch contains the current dev
        if: github.head_ref != 'qa' && github.head_ref != 'main'
        run: |
          behind=$(git rev-list --count HEAD..origin/dev)

          if [ "$behind" -ne 0 ]; then
            echo "ERROR: this branch is $behind commit(s) behind dev."
            echo "Bring dev into it ('Update branch' on the PR, or: git merge origin/dev) and push again."
            git log --oneline --no-merges HEAD..origin/dev
            exit 1
          fi

          echo "The branch contains the current dev."