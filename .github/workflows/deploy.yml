# Deploy
#
# Runs when main is updated: the checks one last time, then the build of what will be delivered.
# There is no deployment target yet, so the last job is a placeholder for the Docker task.

name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Two pushes to main one after the other are delivered in order, and a delivery that has started is not cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Verify main
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  build:
    name: Build the client
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist/
          retention-days: 30

  # PLACEHOLDER: to be filled in by the Docker task.
  #
  # What it has to do:
  #  - build the Docker image from the Dockerfile and publish it to the container registry;
  #  - or call the workflow of the Docker task (docker.yml, with `on: workflow_call`), so the image is built
  #    only after the two jobs above have passed.
  #
  # Where the pieces go:
  #  - the extra permissions (for example `packages: write` to publish to GitHub's registry) go in this job,
  #    not at the top of the file, so the other jobs keep read-only access;
  #  - the secrets of the registry are repository secrets, used here as ${{ secrets.NAME }}.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to deploy yet
        run: echo "::notice title=Deploy::No deployment target yet. See the comments of this job."
