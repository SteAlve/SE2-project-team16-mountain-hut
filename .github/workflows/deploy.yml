# Deploy
#
# Runs when main is updated: the checks one last time, the build of what will be delivered, then the
# Docker image (docker.yml).

name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Two pushes to main one after the other are delivered in order, and a delivery that has started is not cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Verify main
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  build:
    name: Build the client
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist/
          retention-days: 30

  # The image is built only after the two jobs above have passed. The permission to publish is given
  # here, not at the top of the file, so the other jobs keep read-only access.
  deploy:
    name: Deploy
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: latest
